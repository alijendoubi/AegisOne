name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# ── Web jobs ────────────────────────────────────────────────────────────────────

jobs:
  web-lint-typecheck:
    name: Web — Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  web-build:
    name: Web — Build
    runs-on: ubuntu-latest
    needs: web-lint-typecheck
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://aegisone.com
      RESEND_API_KEY: placeholder
      TURNSTILE_SECRET_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

# ── Rust agent jobs ─────────────────────────────────────────────────────────────

  agent-check:
    name: Agent — Check & Clippy (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target

      - name: Format check
        run: cargo fmt --check

      - name: Check (all targets)
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  agent-test:
    name: Agent — Tests (Linux)
    runs-on: ubuntu-latest
    needs: agent-check
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target

      - name: Run tests
        run: cargo test --all-targets

  agent-build-windows:
    name: Agent — Release Build (Windows x64)
    runs-on: windows-latest
    needs: agent-check
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegisone-agent-windows-x64
          path: agent/target/release/aegisone-agent.exe
          retention-days: 30
