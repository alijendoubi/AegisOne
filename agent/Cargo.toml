[package]
name        = "aegisone-agent"
version     = "0.1.0"
edition     = "2021"
authors     = ["AegisOne Team"]
description = "On-device ransomware detection and response agent"
default-run = "aegisone-agent"

[[bin]]
name = "aegisone-agent"
path = "src/main.rs"

# ── Async runtime ──────────────────────────────────────────────────────────────
[dependencies]
tokio = { version = "1.38", features = ["full"] }

# ── CLI ────────────────────────────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive", "env", "unicode"] }

# ── Filesystem watching ────────────────────────────────────────────────────────
notify                 = { version = "6.1" }
notify-debouncer-full  = { version = "0.3" }

# ── Serialization ──────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml       = { version = "0.8" }

# ── Error handling ─────────────────────────────────────────────────────────────
thiserror = { version = "1.0" }
anyhow    = { version = "1.0" }

# ── Logging / tracing ──────────────────────────────────────────────────────────
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = { version = "0.2" }

# ── Time ───────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── HTTP (Ollama hook-in) ──────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── UUID for incident IDs ──────────────────────────────────────────────────────
uuid = { version = "1.8", features = ["v4", "serde"] }

# ── SHA-256 for canary sentinel ────────────────────────────────────────────────
sha2   = { version = "0.10" }
hex    = { version = "0.4" }
rand   = { version = "0.8" }

# ── Windows-specific ───────────────────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]}

# ── Non-Windows process management ────────────────────────────────────────────
[target.'cfg(not(windows))'.dependencies]
libc = { version = "0.2" }

# ── Dev / test ─────────────────────────────────────────────────────────────────
[dev-dependencies]
tempfile   = { version = "3.10" }
tokio-test = { version = "0.4" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = true
